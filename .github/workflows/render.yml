name: render

on:
  push:
    paths:
      - 'films/**'
      - '.github/workflows/render.yml'
  workflow_dispatch:
    inputs:
      film:
        description: '要渲染的片子目录名（films/<name>）'
        required: true
      heights:
        description: '短边像素，逗号分隔，例如 480 或 720,1080'
        default: '480'

permissions:
  contents: write

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      HEIGHTS: ${{ inputs.heights || '480' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip fonts-noto-cjk

      - name: npm + chromium
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Patch no-sandbox
        run: |
          if ! grep -q "no-sandbox" scripts/render.mjs; then
            sed -i "s/'--disable-lcd-text'/'--disable-lcd-text', '--no-sandbox'/" scripts/render.mjs
          fi
          grep -n "no-sandbox" scripts/render.mjs

      - name: Fonts
        run: bash ops/fetch_fonts.sh

      - name: Python deps
        run: pip install "edge-tts>=7.3.1"

      - name: Resolve film
        run: |
          set -euo pipefail
          F="${{ inputs.film }}"
          if [ -z "$F" ]; then
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              F=$(git show --pretty=format: --name-only HEAD -- films | grep . | head -1 | cut -d/ -f2 || true)
            else
              F=$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- films | grep . | head -1 | cut -d/ -f2 || true)
            fi
          fi
          if [ -z "${F:-}" ] || [ ! -f "films/$F/film.js" ]; then
            echo "::error::无法确定要渲染的片子（FILM='${F:-}'）"; exit 1
          fi
          echo "FILM=$F" >> "$GITHUB_ENV"
          echo "WORK=work/$F" >> "$GITHUB_ENV"
          echo "片子：$F · 分辨率：$HEIGHTS"

      - name: Build film
        run: |
          set -euo pipefail
          rm -rf "$WORK"
          node scripts/new_film.mjs "$WORK"
          cp "films/$FILM/script.json" "$WORK/script.json"
          cp "films/$FILM/film.js" "$WORK/film.js"
          mkdir -p "$WORK/assets/img"
          if [ -f "films/$FILM/assets.txt" ]; then
            while read -r name url; do
              [ -z "${name:-}" ] && continue
              curl -fsSL -A "ws-render/1.0" -o "$WORK/assets/img/$name" "$url"
              echo "img $name $(wc -c < "$WORK/assets/img/$name") B"
            done < "films/$FILM/assets.txt"
          fi
          python scripts/temp_voice.py "$WORK/script.json"
          grep -o '"duration":[^,]*' "$WORK/timeline.json"

      - name: Check shot table
        run: |
          set -o pipefail
          node scripts/render.mjs --dir "$WORK" --check 2>&1 | tee check.log
          if grep -q "写错了" check.log; then echo "::error::镜头表有错（见 check.log）"; exit 1; fi

      - name: Sheet
        if: always()
        run: node scripts/render.mjs --dir "$WORK" --sheet 2>&1 | tail -40 || true

      - name: Render
        run: |
          set -euo pipefail
          for H in ${HEIGHTS//,/ }; do
            echo "== render $H =="
            node scripts/render.mjs --dir "$WORK" --video --h "$H" 2>&1 | tee "render-$H.log"
          done

      - name: Mix + mux audio
        run: |
          set -euo pipefail
          python scripts/mix.py "$WORK" 2>&1 | tail -20
          for H in ${HEIGHTS//,/ }; do
            ffmpeg -v error -y -i "$WORK/out/visual_$H.mp4" -i "$WORK/mix_master.wav" \
              -c:v copy -c:a aac -b:a 160k -shortest "$WORK/out/mux_$H.mp4"
            ls -lh "$WORK/out/mux_$H.mp4"
          done

      - name: Collect
        if: always()
        run: |
          mkdir -p dist
          echo "== $WORK/out =="
          ls -lh "$WORK/out" || true
          for f in "$WORK"/out/mux_*.mp4; do
            [ -f "$f" ] || continue
            H=$(basename "$f" | sed 's/^mux_//; s/\.mp4$//')
            cp "$f" "dist/$FILM-${H}p.mp4"
          done
          for s in sheet.png sheet.jpg; do
            if [ -f "$WORK/out/$s" ]; then cp "$WORK/out/$s" "dist/$s"; fi
          done
          cp check.log "dist/check.log" 2>/dev/null || true
          ls -lh dist || true

      - name: Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: render-${{ github.run_number }}
          name: ${{ env.FILM }} · run ${{ github.run_number }}
          body: |
            自动渲染产物。片子 `${{ env.FILM }}` · run ${{ github.run_number }} · commit ${{ github.sha }}
            分辨率：${{ env.HEIGHTS }}p（短边）。sheet.png 是每镜三个代表帧，check.log 是镜头表自检。
          files: dist/*
          fail_on_unmatched_files: false

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILM }}-run${{ github.run_number }}
          path: dist/*
          if-no-files-found: warn

      - name: Status
        if: always()
        run: |
          python - <<'PY'
          import json, os, pathlib
          d = pathlib.Path('dist')
          files = sorted(p.name for p in d.glob('*')) if d.exists() else []
          st = {"film": os.environ.get("FILM"), "run": os.environ.get("GITHUB_RUN_NUMBER"),
                "sha": os.environ.get("GITHUB_SHA"), "heights": os.environ.get("HEIGHTS"),
                "result": os.environ.get("JOB_STATUS"), "files": files}
          pathlib.Path('render-status.json').write_text(json.dumps(st, indent=1), encoding='utf-8')
          print(st)
          PY
        env:
          JOB_STATUS: ${{ job.status }}

      - name: Commit status
        if: always()
        run: |
          git config user.name "render-bot"
          git config user.email "render-bot@users.noreply.github.com"
          git add render-status.json
          git commit -m "chore: render status run ${{ github.run_number }} [skip ci]" || true
          git push || true
